name: Build and Publish

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  NUGET_USER: amir734jj

jobs:
  build:
    runs-on: ubuntu-latest
    environment: NUGET_API_KEY
    permissions:
      id-token: write # required to request the OIDC token for NuGet trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '2.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack
        if: github.event_name == 'push'
        run: dotnet pack Stream-ripper/Stream-ripper.csproj -c Release -o ./artifacts/

      - name: NuGet login (OIDC -> temp API key)
        if: github.event_name == 'push'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to NuGet
        if: github.event_name == 'push'
        run: dotnet nuget push ./artifacts/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
